<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tattty 4 All — Tattoo Generator</title>
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #f5f0e8;
        --accent: #c0392b;
        --accent2: #8b5cf6;
        --border: #2d2d2d;
        --muted: #6b6b6b;
        --card-bg: #fff9f0;
        --radius: 8px;
        --font-mono: "Courier New", Courier, monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--font-mono);
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
        padding: 16px;
      }

      header {
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 3px solid var(--ink);
        padding-bottom: 12px;
      }

      header h1 {
        font-size: 1.6rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      header p {
        color: var(--muted);
        font-size: 0.75rem;
        margin-top: 4px;
      }

      .trigger-badge {
        display: inline-block;
        background: var(--ink);
        color: var(--paper);
        font-size: 0.65rem;
        padding: 2px 8px;
        border-radius: 999px;
        letter-spacing: 0.1em;
        margin-top: 6px;
      }

      /* ── Prompt area ── */
      .prompt-section {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
      }

      .prompt-section label {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .prompt-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .trigger-prefix {
        background: var(--ink);
        color: var(--paper);
        padding: 10px 10px;
        border-radius: var(--radius) 0 0 var(--radius);
        font-size: 0.7rem;
        white-space: nowrap;
        align-self: stretch;
        display: flex;
        align-items: center;
        letter-spacing: 0.05em;
        flex-shrink: 0;
      }

      textarea {
        flex: 1;
        border: 2px solid var(--border);
        border-left: none;
        border-radius: 0 var(--radius) var(--radius) 0;
        padding: 10px 12px;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        background: #fff;
        resize: vertical;
        min-height: 72px;
        outline: none;
        color: var(--ink);
      }

      textarea:focus { border-color: var(--accent2); }

      /* ── Options row ── */
      .options-row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .options-row label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-right: 4px;
      }

      select {
        border: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 10px;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        background: #fff;
        cursor: pointer;
        outline: none;
      }

      /* ── Generate button ── */
      #generate-btn {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 12px;
        background: var(--ink);
        color: var(--paper);
        border: none;
        border-radius: var(--radius);
        font-family: var(--font-mono);
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
      }

      #generate-btn:hover:not(:disabled) { background: var(--accent); }
      #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Status ── */
      #status {
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
        min-height: 18px;
        margin-top: 8px;
      }

      #status.error { color: var(--accent); }

      /* ── Latest result ── */
      #latest-result {
        margin-bottom: 16px;
        display: none;
      }

      #latest-result img {
        width: 100%;
        border: 3px solid var(--ink);
        border-radius: var(--radius);
        display: block;
      }

      #latest-prompt-label {
        font-size: 0.68rem;
        color: var(--muted);
        margin-top: 6px;
        word-break: break-word;
      }

      /* ── Gallery ── */
      .gallery-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        border-top: 2px solid var(--ink);
        padding-top: 14px;
      }

      .gallery-header h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      #clear-btn {
        background: none;
        border: 1px solid var(--muted);
        border-radius: var(--radius);
        padding: 3px 8px;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--muted);
        cursor: pointer;
      }

      #clear-btn:hover { border-color: var(--accent); color: var(--accent); }

      #gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .gallery-item {
        position: relative;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .gallery-item:hover { border-color: var(--accent2); }

      .gallery-item img {
        width: 100%;
        display: block;
        aspect-ratio: 1;
        object-fit: cover;
      }

      .gallery-item .gallery-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.75);
        color: #fff;
        font-size: 0.6rem;
        padding: 4px 6px;
        display: none;
        word-break: break-word;
      }

      .gallery-item:hover .gallery-overlay { display: block; }

      #gallery-empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tattty 4 All</h1>
      <p>Tattoo-focused LoRA · 678 sketch designs</p>
      <span class="trigger-badge">trigger: TA-TTT-OO-ME</span>
    </header>

    <div class="prompt-section">
      <label>Describe your tattoo</label>
      <div class="prompt-row">
        <div class="trigger-prefix">TA-TTT-OO-ME</div>
        <textarea
          id="prompt-input"
          placeholder="a bold lion with floral details, blackwork style, clean lines..."
        ></textarea>
      </div>

      <div class="options-row">
        <label for="aspect-select">Ratio</label>
        <select id="aspect-select">
          <option value="1:1" selected>1:1 Square</option>
          <option value="9:16">9:16 Portrait</option>
          <option value="16:9">16:9 Landscape</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
        </select>
      </div>

      <button id="generate-btn">✦ Generate Tattoo</button>
      <div id="status"></div>
    </div>

    <div id="latest-result">
      <img id="latest-img" src="" alt="Generated tattoo" />
      <div id="latest-prompt-label"></div>
    </div>

    <div class="gallery-header">
      <h2>Gallery</h2>
      <button id="clear-btn">Clear</button>
    </div>
    <div id="gallery">
      <div id="gallery-empty">No generations yet — create your first tattoo above!</div>
    </div>

    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
